services:
  water-drill:
    build: .
    image: water-isolation-drill:latest
    container_name: water-isolation-drill
    ports:
      - "8080:8080"
    environment:
      WATER_HOST: 0.0.0.0
      WATER_PORT: 8080
      WATER_DB_PATH: /data/water.db
    volumes:
      - water-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  water-data:
